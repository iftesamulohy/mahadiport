# Placeholders (__DOMAIN__ / __APP_DIR__ / __SOCK__) are substituted by
# deploy/setup_vps.sh. certbot --nginx adds the :443 server block + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 25M;

    # WhiteNoise can also serve /static/, but nginx is faster and offloads it.
    location /static/ {
        alias __APP_DIR__/staticfiles/;
        expires 30d;
        access_log off;
    }

    # REQUIRED in production: this project only serves /media/ via Django when
    # DEBUG=True (see config/urls.py), so nginx must serve it directly.
    location /media/ {
        alias __APP_DIR__/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:__SOCK__;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Essential: prod.py sets SECURE_PROXY_SSL_HEADER on this header, so
        # Django knows the request is HTTPS and won't loop-redirect.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
